<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myriam Trösch</title>
  <meta name="description" content="Myriam Trösch, Mediamatikerin. Portfolio und Web-Projekte.">
  <link rel="icon" href="logo/favicon.png?v=2" type="image/png">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="apple-touch-icon" href="logo/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --schwarz: #000000;
      --weinrot: #570d1f;
      --mauve: #93878b;
      --weiss: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--schwarz);
      color: var(--weiss);
      font-family: "Hedvig Letters Serif", Georgia, serif;
      line-height: 1.6;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 100px 20px 60px;
    }

    h1,
    h2 {
      font-family: "Montserrat", Arial, sans-serif;
      font-weight: 400;
      line-height: 1.2;
    }

    h1 {
      font-size: 64px;
      color: var(--mauve);
      text-align: center;
    }

    .start-logo {
      display: block;
      width: 170px;
      height: auto;
      margin: 0 auto 36px;
    }

    .untertitel {
      margin-top: 12px;
      font-size: 20px;
      color: var(--mauve);
    }

    .karten {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 70px;
    }

    .karte {
      display: flex;
      flex-direction: column;
      color: var(--weiss);
      text-decoration: none;
      background: #111;
      overflow: hidden;
      transition: transform 0.3s;
    }

    .karte:hover {
      transform: translateY(-6px);
    }

    .karte-bild {
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .karte img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: transform 0.4s;
    }

    .karte:hover img {
      transform: scale(1.05);
    }

    .karte-text {
      flex: 1;
      padding: 24px;
      border-top: 4px solid var(--weinrot);
    }

    .karte:nth-child(2) .karte-text { border-top-color: var(--mauve); }
    .karte:nth-child(3) .karte-text { border-top-color: var(--weiss); }

    .karte h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .karte p {
      color: #c9c3c5;
    }

    .karte .pfeil {
      display: inline-block;
      margin-top: 16px;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .karte:hover .pfeil {
      text-decoration: underline;
    }

    footer {
      padding: 40px 20px;
      text-align: center;
    }

    footer a {
      color: var(--weiss);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      main {
        padding-top: 60px;
      }

      h1 {
        font-size: 44px;
      }

      .karten {
        grid-template-columns: 1fr;
        margin-top: 40px;
      }
    }
  </style>
</head>
<body>

  <main>
    <img class="start-logo" src="logo/logo-weiss.png" alt="Logo Myriam Trösch">
    <h1>Myriam Trösch</h1>

    <div class="karten">
      <a class="karte" href="portfolio/index.html" target="_blank" rel="noopener">
        <div class="karte-bild">
          <img src="portfolio/img/home-hero.jpg" alt="">
        </div>
        <div class="karte-text">
          <h2>Portfolio</h2>
          <p>Über mi u e chline Iblick i mini Arbeite</p>
          <span class="pfeil">Aaluege &rarr;</span>
        </div>
      </a>

      <a class="karte" href="hogwarts/home.html" target="_blank" rel="noopener">
        <div class="karte-bild">
          <img src="portfolio/img/projekt-hogwarts.png" alt="Screenshot der Hogwarts Schulwebsite">
        </div>
        <div class="karte-text">
          <h2>Hogwarts Schulwebsite</h2>
          <p>Schuuprojekt mit HTML u CSS</p>
          <span class="pfeil">Aaluege &rarr;</span>
        </div>
      </a>

      <a class="karte" href="galaxy/" target="_blank" rel="noopener">
        <div class="karte-bild">
          <img src="portfolio/img/projekt-galaxy.png" alt="Screenshot vom Galaxy Game">
        </div>
        <div class="karte-text">
          <h2>Galaxy Game</h2>
          <p>Game mit JavaScript, HTML u CSS (nur Desktop)</p>
          <span class="pfeil">Spile &rarr;</span>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <a href="impressum/index.html" target="_blank" rel="noopener">Impressum &amp; Datenschutz</a>
  </footer>

</body>
</html>
